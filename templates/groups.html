<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Groups</title>

    <style>
        body {
            font-family: Arial;
            margin: 40px;
            background: #f5f5f5;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            background: white;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
        }

        th {
            background: steelblue;
            color: white;
        }
    </style>

</head>

<body>

<h1>Groups</h1>

<table>

<tr>
    <th>ID</th>
    <th>Title</th>
    <th>Tasks</th>
</tr>

{% for group in groups %}

<tr>
    <td>{{ group.id }}</td>
    <td>{{ group.title }}</td>
    <td>{{ group.tasks | join(", ") }}</td>
</tr>

{% endfor %}

</table>

</body>
</html>
