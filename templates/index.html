<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Task Manager</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background: #f5f5f5;
        }

        h1 {
            color: #333;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            background: white;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #4CAF50;
            color: white;
        }

        tr:nth-child(even) {
            background: #f2f2f2;
        }
    </style>

</head>

<body>

<h1>Tasks</h1>

<table>

<tr>
    <th>ID</th>
    <th>Title</th>
    <th>Status</th>
    <th>Group</th>
</tr>

{% for task in tasks %}

<tr>
    <td>{{ task.id }}</td>
    <td>{{ task.title }}</td>
    <td>{{ task.status }}</td>
    <td>{{ task.group }}</td>
</tr>

{% endfor %}

</table>

</body>
</html>
